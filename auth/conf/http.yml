http:
  addr: ":8080"
  timeout: 30s
  readHeaderTimeout: 5s
  idleTimeout: 2m
  docs:
    enabled: false
    servers:
      - url: "https://example.com/api/auth"
        description: "prod"
      - url: "https://dev.example.com/api/auth"
        description: "dev"
      - url: "http://127.0.0.1:8080"
        description: "local"
  profiler:
    enabled: false
    addr: "127.0.0.1:6060"
