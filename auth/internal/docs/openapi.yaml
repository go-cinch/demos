          type: string
    EncryptedRegisterInput:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id:
          type: string
          example: "u7rUnVYJdWzvX41WeyuR1J6mM8Xr0jYjNQQHf9U5gEo"
        credential:
          type: string
          example: "eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIn0..."
