components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Action:
      type: object
      required: [button, code, config, created_at, group, id, menu, name, resource, scope, updated_at, word]
      properties:
        button:
          type: string
        code:
          type: string
        config:
          $ref: "#/components/schemas/Config"
        created_at:
          type: integer
          format: int64
        group:
          type: string
        id:
          type: integer
          format: int64
        menu:
          type: string
        name:
          type: string
        names:
          type: object
          additionalProperties:
            type: string
        resource:
          type: string
        scope:
          type: string
        updated_at:
          type: integer
          format: int64
        word:
          type: string
    ActionReference:
      type: object
      required: [id, word]
      properties:
        id:
          type: integer
          format: int64
        word:
          type: string
    Breakdown:
      type: object
      required: [failed, name, total]
      properties:
        failed:
          type: integer
          format: int64
        name:
          type: string
        total:
          type: integer
          format: int64
    Bucket:
      type: object
      required: [at, ended_at, failure, success]
      properties:
        at:
          type: integer
          format: int64
        ended_at:
          type: integer
          format: int64
        failure:
          type: integer
          format: int64
        mfa_challenge:
          type: integer
          format: int64
        success:
          type: integer
          format: int64
    CaptchaPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
    CatalogResult:
      type: object
      properties:
        defined_actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionReference"
        operations:
          type: array
          items:
            type: string
        resource_catalog:
          $ref: "#/components/schemas/ResourceCatalog"
        scopes:
          type: array
          items:
            type: string
    ChallengeInput:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
    Config:
      type: object
      required: [endpoints, feature_keys, ui]
      properties:
        bindings:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ResourceBinding"
        builtin:
          type: string
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/ResourceEndpoint"
        feature_keys:
          type: array
          nullable: true
          items:
            type: string
        operation:
          type: string
        permission_scope:
          type: string
        permission_scopes:
          type: array
          items:
            type: string
        resource_key:
          type: string
        resource_keys:
          type: array
          nullable: true
          items:
            type: string
        ui:
          type: array
          items:
            $ref: "#/components/schemas/ResourceUI"
    CreateActionInput:
      type: object
      required: [config, word]
      properties:
        config:
          $ref: "#/components/schemas/Config"
        group:
          type: string
        names:
          type: object
          additionalProperties:
            type: string
        word:
          type: string
          example: "admin:read:system:user"
    CreateDictionaryInput:
      type: object
      required: [key, name, value]
      properties:
        description:
          type: string
        enabled:
          type: boolean
          nullable: true
        key:
          type: string
          example: "APPLICATION_FEATURE_FLAGS"
        name:
          type: string
          example: "Application Feature Flags"
        value:
          oneOf:
            - type: object
            - type: array
              items: {}
            - type: string
              nullable: true
            - type: number
            - type: boolean
    CreateRoleInput:
      type: object
      required: [name, word]
      properties:
        action_bindings:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ResourceBinding"
        action_codes:
          type: array
          items:
            type: string
        name:
          type: string
          example: "Operator"
        word:
          type: string
          example: "operator"
    CreateUserGroupInput:
