components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Action:
      type: object
      required: [button, code, created_at, group, id, menu, name, resource, updated_at, word]
      properties:
        button:
          type: string
        code:
          type: string
        created_at:
          type: integer
          format: int64
        group:
          type: string
        id:
          type: integer
          format: int64
        menu:
          type: string
        name:
          type: string
        resource:
          type: string
        updated_at:
          type: integer
          format: int64
        word:
          type: string
    ActionView:
      type: object
      required: [button, code, created_at, group, id, menu, name, resource, updated_at, word]
      properties:
        button:
          type: string
        code:
          type: string
        created_at:
          type: integer
          format: int64
        group:
          type: string
        id:
          type: integer
          format: int64
        menu:
          type: string
        name:
          type: string
        resource:
          type: string
        updated_at:
          type: integer
          format: int64
        word:
          type: string
    Breakdown:
      type: object
      required: [failed, name, total]
      properties:
        failed:
          type: integer
          format: int64
        name:
          type: string
        total:
          type: integer
          format: int64
    Bucket:
      type: object
      required: [at, failure, success]
      properties:
        at:
          type: integer
          format: int64
        failure:
          type: integer
          format: int64
        success:
          type: integer
          format: int64
    CaptchaPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
    ChallengeInput:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
    CreateActionInput:
      type: object
      required: [group, name, word]
      properties:
        button:
          type: string
          example: "system.user.read"
        group:
          type: string
          example: "User"
        menu:
          type: string
          example: "/system/user"
        name:
          type: string
          example: "User Query"
        resource:
          type: string
          example: "GET|/user|/auth.v1.User/ListUsers"
        word:
          type: string
          example: "user.read"
    CreateInput:
      type: object
      required: [content, expired_at, recipient_ids, scope, title, type]
      properties:
        content:
          type: string
        expired_at:
          type: integer
          nullable: true
          format: int64
        recipient_ids:
          type: array
          items:
            type: integer
            format: int64
        scope:
          type: string
        title:
          type: string
        type:
          type: string
    CreateRoleInput:
      type: object
      required: [name, word]
      properties:
        action_codes:
          type: array
          items:
            type: string
        name:
          type: string
          example: "Operator"
        word:
          type: string
          example: "operator"
    CreateUserGroupInput:
      type: object
      required: [name, word]
      properties:
        action_codes:
          type: array
          items:
            type: string
        name:
          type: string
          example: "Auditors"
        user_ids:
          type: array
          items:
            type: integer
            format: int64
        word:
          type: string
          example: "auditor"
    CreateUserRequest:
      type: object
      required: [challenge_id, credential, username]
      properties:
        action_codes:
          type: array
          items:
            type: string
        challenge_id:
          type: string
          example: "u7rUnVYJdWzvX41WeyuR1J6mM8Xr0jYjNQQHf9U5gEo"
        credential:
          type: string
          example: "eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIn0..."
        metadata:
          type: object
          additionalProperties:
            type: object
        role_id:
          type: integer
          nullable: true
          format: int64
        username:
          type: string
          example: "operator"
    CreateWhitelistInput:
      type: object
      required: [category, resource]
      properties:
        category:
          type: integer
          format: int32
          example: 0
        resource:
          type: string
          example: "GET|/healthz"
    CredentialChallenge:
      type: object
      required: [challenge_id, expired_at, key_id, public_key]
      properties:
        challenge_id:
          type: string
        expired_at:
          type: integer
          format: int64
        key_id:
          type: string
        public_key:
          $ref: "#/components/schemas/PublicJWK"
    Dictionary:
      type: object
      required: [created_at, description, enabled, id, key, name, updated_at, value]
      properties:
        created_at:
          type: integer
          format: int64
        description:
          type: string
        enabled:
          type: boolean
        id:
          type: integer
          format: int64
        key:
          type: string
        name:
          type: string
        updated_at:
          type: integer
          format: int64
        value:
          oneOf:
            - type: object
            - type: array
              items: {}
            - type: string
              nullable: true
            - type: number
            - type: boolean
    EncryptedLoginInput:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id:
          type: string
          example: "u7rUnVYJdWzvX41WeyuR1J6mM8Xr0jYjNQQHf9U5gEo"
        credential:
          type: string
          example: "eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIn0..."
