            schema:
              description: "username must contain a valid email address with a dotted domain, not an account username. Invalid addresses return 400 AUTH_EMAIL_ADDRESS_INVALID before verification or queueing. The server trims surrounding whitespace and resolves the verified email alias. Maximum JSON request body: 16384 bytes."
