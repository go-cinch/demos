  /pub/login:
    post:
      summary: "POST /pub/login"
      operationId: postPubLogin
      tags: ["Auth"]
      parameters:
        - name: X-TOTP-Code
          in: header
          required: false
          description: "Six-digit TOTP only; submit directly on this endpoint"
          schema:
            type: string
        - name: X-MFA-Ticket
          in: header
          required: false
          description: "One-use first-factor continuation returned by this login endpoint; send with exactly one of X-TOTP-Code or X-Recovery-Code and an empty JSON object. Ticket lifetime: 5m0s; X-MFA-Expires-At is the absolute Unix-millisecond deadline."
          schema:
            type: string
        - name: X-Recovery-Code
          in: header
          required: false
          description: "Unused recovery code accepted only with X-MFA-Ticket and an empty JSON object after password verification; do not combine with X-TOTP-Code. Recovery invalidates the previous factor, all recovery codes and existing sessions, then returns an enrollment-restricted session with onboarding requirements available from GET /status. It does not complete login or authorize sensitive operations; bind a new authenticator before continuing"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: "Without X-MFA-Ticket, send challenge_id and credential for encrypted password or email-code login. With X-MFA-Ticket, send only {} for TOTP or password-verified recovery. Email-code login recovery must include a fresh login JWE containing the current password. Use exactly one of X-TOTP-Code or X-Recovery-Code. JSON null is rejected. Maximum JSON request body: 16384 bytes."
              anyOf:
                - type: object
                  additionalProperties: false
                - $ref: "#/components/schemas/EncryptedLoginInput"
      responses:
        "200":
          description: "OK Accept the replacement tokens, then GET /status?purpose=onboarding&f=requirements before business navigation. Session restrictions are not returned in response headers."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          description: "Bad Request; invalid login credential; slider verification is required; invalid login; Bad Request; Bad Request"
          headers:
            X-Verification-Required:
              schema:
                type: string
            X-MFA-Ticket:
              schema:
                type: string
            X-MFA-Expires-At:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          headers:
            X-MFA-Ticket:
              schema:
                type: string
            X-MFA-Expires-At:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden"
          headers:
            X-Verification-Required:
              schema:
                type: string
            X-MFA-Ticket:
              schema:
                type: string
            X-MFA-Expires-At:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "Too Many Requests"
          headers:
            X-Verification-Required:
              schema:
                type: string
            X-MFA-Ticket:
              schema:
                type: string
            X-MFA-Expires-At:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          headers:
            X-MFA-Ticket:
              schema:
                type: string
            X-MFA-Expires-At:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Service Unavailable"
          headers:
            X-MFA-Ticket:
              schema:
                type: string
            X-MFA-Expires-At:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pub/login/email-code:
