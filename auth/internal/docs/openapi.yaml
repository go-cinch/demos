  /pub/status:
    get:
      summary: "GET /pub/status"
      operationId: getPubStatus
      tags: ["Auth"]
      parameters:
        - name: X-MFA-Ticket
          in: header
          required: false
          description: "Required only for login_totp_recovery. Unexpired login MFA ticket from successful first-factor verification; read without consumption or lifetime extension. Never send it in the URL."
          schema:
            type: string
        - name: purpose
          in: query
          required: true
          description: "Verification flow: login (requirements,email_code), login_totp_recovery (methods,email_code, requires a valid X-MFA-Ticket). Account binding is only disclosed for the verified ticket owner; authenticated purposes are rejected"
          schema:
            type: string
        - name: f
          in: query
          required: true
          description: "Comma-separated response groups allowed for this purpose. Missing, empty, unknown, duplicate selectors and repeated parameters return 400. Only selected dependencies are loaded. requirements never issues a CAPTCHA; explicitly POST /pub/captcha with username to issue one."
          schema:
            type: string
        - name: browser_uuid
          in: query
          required: false
          description: "Required only when selecting email_code; source IP also contributes to the send cooldown."
          schema:
            type: string
            format: uuid
        - name: username
          in: query
          required: false
          description: "Required for login requirements. Omit for an email_code-only browser/IP cooldown before entering an identifier. Unknown accounts retain the existing non-disclosing response behavior."
          schema:
            type: string
        - name: email
          in: query
          required: false
          description: "Optional for email_bind; omit for the browser/IP cooldown before entering an address. When present, reads pending verification for this unverified target, not the account mailbox."
          schema:
            type: string
