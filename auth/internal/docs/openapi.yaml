components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Action:
      type: object
      required: [button, code, created_at, group, id, menu, name, resource, updated_at, word]
      properties:
        button:
          type: string
        code:
          type: string
        created_at:
          type: integer
          format: int64
        group:
          type: string
        id:
          type: integer
          format: int64
        menu:
          type: string
        name:
          type: string
        resource:
          type: string
        updated_at:
          type: integer
          format: int64
        word:
          type: string
    ActionView:
      type: object
      required: [button, code, created_at, group, id, menu, name, resource, updated_at, word]
      properties:
        button:
          type: string
        code:
          type: string
        created_at:
          type: integer
          format: int64
        group:
          type: string
        id:
          type: integer
          format: int64
        menu:
          type: string
        name:
          type: string
        resource:
          type: string
        updated_at:
          type: integer
          format: int64
        word:
          type: string
    CaptchaPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
    ChallengeInput:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
    CreateActionInput:
      type: object
      required: [group, name, word]
      properties:
        button:
          type: string
          example: "system.user.read"
        group:
          type: string
          example: "User"
        menu:
          type: string
          example: "/system/user"
        name:
          type: string
          example: "User Query"
        resource:
          type: string
          example: "GET|/user|/auth.v1.User/ListUsers"
        word:
          type: string
          example: "user.read"
    CreateRoleInput:
      type: object
      required: [name, word]
      properties:
        action_codes:
          type: array
          items:
            type: string
        name:
          type: string
          example: "Operator"
        word:
          type: string
          example: "operator"
    CreateUserGroupInput:
      type: object
      required: [name, word]
      properties:
        action_codes:
          type: array
          items:
            type: string
        name:
          type: string
          example: "Auditors"
        user_ids:
          type: array
          items:
            type: integer
            format: int64
        word:
          type: string
          example: "auditor"
    CreateUserRequest:
      type: object
      required: [challenge_id, credential, username]
      properties:
        action_codes:
          type: array
          items:
            type: string
        challenge_id:
          type: string
          example: "u7rUnVYJdWzvX41WeyuR1J6mM8Xr0jYjNQQHf9U5gEo"
        credential:
          type: string
          example: "eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIn0..."
        metadata:
          type: object
          additionalProperties:
            type: object
        role_id:
          type: integer
          format: int64
        username:
          type: string
          example: "operator"
    CreateWhitelistInput:
      type: object
      required: [category, resource]
      properties:
        category:
          type: integer
          format: int32
          example: 0
        resource:
          type: string
          example: "GET|/healthz"
